<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>EduArt Interactive</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      /* الخلفية الافتراضية تكون بيضاء للموديلات العادية */
      background: #ffffff; 
      transition: background-color 0.3s ease;
    }
    #app-container, iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>

  <div id="app-container"></div>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const id = urlParams.get('id');
      const lang = urlParams.get('lang') || 'ar';
      const key = urlParams.get('key');
      
      const SECRET_KEY = "edu2026";
      // رابط صفحة الكمين الخاصة بكِ
      const TRAP_PAGE_URL = "https://edu-art-3d-book.my.canva.site/cards-trap"; 

      // 1. التحقق من مفتاح الحماية
      if (key !== SECRET_KEY) {
        window.location.href = TRAP_PAGE_URL;
        return;
      }

      // 2. تنظيف شريط العنوان فوراً ومسح المفتاح السري!
      const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname + `?id=${id}&lang=${lang}`;
      window.history.replaceState({path: cleanUrl}, '', cleanUrl);

      // 3. خريطة الروابط (ضع رابط الـ iframe الأصلي أمام كل id)
      const modelsBaseUrls = {
       "Badilosauru": "https://edu-art-3d.github.io/Eduart-Basilosauru-3D/",
"pterodactyl": "https://edu-art-3d.github.io/Eduart-pterodactyl-3D/",
"ichthyosaurus": "https://edu-art-3d.github.io/Eduart-ichthyosaurus-3D/card.html",
"Brachiosauru": "https://edu-art-3d.github.io/Eduart-Brachiosauru-3D/card.html",
"Trex": "https://edu-art-3d.github.io/Eduart-Trex-3D/card.html",
"triceratops": "https://edu-art-3d.github.io/Eduart-triceratops-3D/card.html",
"Velociraptor": "https://edu-art-3d.github.io/Eduart-Velociraptor-3D/card.html",
"moon": "https://edu-art-3d.github.io/Eduart-moon-3D/card.html",
"mars": "https://edu-art-3d.github.io/Eduart-mars-3D/card.html",
"spinosaurs": "https://edu-art-3d.github.io/Eduart-spinosaurs-3D/",
"nakhla": "https://edu-art-3d.github.io/Eduart-nakhla-3D/",
"iron": "https://edu-art-3d.github.io/Eduart-iron-3D/",
"stone": "https://edu-art-3d.github.io/Eduart-stone-3D/",
"iron-stone": "https://edu-art-3d.github.io/Eduart-iron-stone-3D/",
"Moeritherium": "https://edu-art-3d.github.io/Eduart-Moeritheriu-3D/",
"Stegosauru": "https://edu-art-3d.github.io/Eduart-Stegosauru-3D/",
"Ankylosauru": "https://edu-art-3d.github.io/Eduart-Ankylosauru-3D/",
"Arsinoitherium": "https://edu-art-3d.github.io/Eduart-Arsinoitherium-3D/",
"mammoth": "https://edu-art-3d.github.io/Eduart-mammoth-3D/",
"carcharodontosauru": "https://edu-art-3d.github.io/Eduart-carcharodontosauru-3D/"
      };

      // 4. قائمة بالنماذج التي تحتاج خلفية سوداء
      const darkThemeModels = ['mars', 'moon', 'nakhla', 'iron', 'stone', 'iron-stone'];

      const selectedModel = modelsBaseUrls[id];

      if (selectedModel) {
        // إذا كان الموديل من قائمة الفضاء والنيازك، نحول خلفية الصفحة للأسود
        if (darkThemeModels.includes(id)) {
          document.body.style.background = "#000000";
        }

        // فتح نموذج الـ 3D داخل iframe وتمرير المفتاح له
        const targetUrl = selectedModel + "?key=" + SECRET_KEY;
        document.getElementById('app-container').innerHTML = `<iframe src="${targetUrl}" allow="camera; microphone; ar"></iframe>`;
      } else {
        window.location.href = TRAP_PAGE_URL;
      }
    })();
  </script>

</body>
</html>
